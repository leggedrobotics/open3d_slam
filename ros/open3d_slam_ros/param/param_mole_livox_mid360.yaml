odometry:
  is_publish_odometry_msgs: true
  odometry_buffer_size: 200
  scan_matching:
    cloud_registration_type: GeneralizedIcp
    icp:
      max_correspondence_dist: 1.0
      knn: 20
      max_distance_knn: 3.0
      max_n_iter: 25
  scan_processing:
    voxel_size: 0.10
    downsampling_ratio: 0.5
    point_cloud_buffer_size: 120
    scan_cropping:
      cropping_radius_max: 30.0
      cropping_radius_min: 0.0
      min_z: -50.0
      max_z: 50.0
      cropper_type: MinMaxRadius

mapping:
  is_print_timing_information: true
  # The assembled map is the terrain-map product. A second 1 cm dense map is
  # not consumed by M4 and is prohibitively expensive for long runs.
  is_build_dense_map: false
  is_attempt_loop_closures: false
  is_use_map_initialization: false
  is_merge_scans_into_map: true
  dump_submaps_to_file_before_after_lc: false
  is_refine_odometry_constraints_between_submaps: false
  min_movement_between_mapping_steps: 0.0
  ignore_minimum_refinement_fitness: true
  mapping_buffer_size: 120
  scan_to_map_registration:
    min_refinement_fitness: 0.7
    scan_to_map_registration_type: GeneralizedIcp
    icp:
      max_correspondence_dist: 0.8
      knn: 20
      max_distance_knn: 3.0
      max_n_iter: 25
    scan_processing:
      # Preserve several LiDAR returns per 20 cm elevation-grid cell before
      # they are fused into the global map.
      voxel_size: 0.1
      downsampling_ratio: 0.25
      point_cloud_buffer_size: 1
      scan_cropping:
        cropping_radius_max: 30.0
        cropping_radius_min: 2.0
        min_z: -50.0
        max_z: 50.0
        cropper_type: MinMaxRadius
  map_initializer:
    is_initialize_interactively: false
    frame_id: map_o3d
    pcd_file_path: ""
    init_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
  submaps:
    size: 20.0
    min_num_range_data: 10
    adjacency_based_revisiting_min_fitness: 0.5
    submaps_num_scan_overlap: 10
  map_builder:
    map_voxel_size: 0.1
    scan_cropping:
      cropping_radius_max: 30.0
      cropping_radius_min: 2.0
      min_z: -50.0
      max_z: 50.0
      cropper_type: MinMaxRadius
    space_carving:
      voxel_size: 0.2
      neighborhood_radius_for_removal: 0.1
      max_raytracing_length: 20.0
      truncation_distance: 0.3
      carve_space_every_n_scans: 5
      min_dot_product_with_normal: 0.5
  dense_map_builder:
    map_voxel_size: 0.1
    scan_cropping:
      cropping_radius_max: 30.0
      cropping_radius_min: 2.0
      min_z: -50.0
      max_z: 50.0
      cropper_type: MinMaxRadius
    space_carving:
      voxel_size: 0.2
      neighborhood_radius_for_removal: 0.1
      max_raytracing_length: 20.0
      truncation_distance: 0.1
      carve_space_every_n_scans: 1
      min_dot_product_with_normal: 0.5
  place_recognition:
    feature_map_normal_estimation_radius: 2.0
    feature_voxel_size: 0.5
    feature_radius: 2.5
    feature_knn: 100
    feature_normal_knn: 20
    ransac_num_iter: 10000000
    ransac_probability: 0.999
    ransac_model_size: 3
    ransac_max_correspondence_dist: 0.75
    ransac_correspondence_checker_distance: 0.8
    ransac_correspondence_checker_edge_length: 0.6
    ransac_min_correspondence_set_size: 40
    max_icp_correspondence_distance: 0.3
    min_icp_refinement_fitness: 0.7
    dump_aligned_place_recognitions_to_file: false
    min_submaps_between_loop_closures: 2
    loop_closure_search_radius: 20.0
    consistency_check:
      max_drift_roll: 30.0
      max_drift_pitch: 30.0
      max_drift_yaw: 30.0
      max_drift_x: 80.0
      max_drift_y: 80.0
      max_drift_z: 40.0
  global_optimization:
    edge_prune_threshold: 0.2
    loop_closure_preference: 2.0
    max_correspondence_distance: 1000.0
    reference_node: 0

visualization:
  # Preserve 10 cm source-map detail in the PointCloud2 consumed by the 20 cm
  # elevation grid. Coarser output voxelization leaves grid cells unobserved.
  assembled_map_voxel_size: 0.1
  submaps_voxel_size: 0.1
  visualize_every_n_msec: 1000.0
  # Feed terrain consumers at up to 5 Hz without speeding up debug submap visualization.
  assembled_map_every_n_msec: 200.0

saving:
  # Persist maps explicitly through save_map/save_submaps. This avoids an
  # expensive automatic export during normal bringup shutdown.
  save_at_mission_end: false
  save_map: false
  save_submaps: false
  save_dense_submaps: false

motion_compensation:
  # The stock Robosense config assumes a repeating spinning-lidar phase model.
  # Livox MID360's non-repeating pattern should not use that undistortion path.
  is_undistort_scan: false
  is_spinning_clockwise: true
  scan_duration: 0.1
  num_poses_vel_estimation: 3
